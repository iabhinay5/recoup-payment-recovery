name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,llm,api]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest --cov=recoup --cov-report=term-missing

      # The provenance ledger. Exits non-zero if an invented parameter is missing from the
      # sensitivity sweep, because an unswept invented parameter can silently carry a
      # headline result.
      - name: Parameter provenance
        run: python scripts/audit_parameters.py

      # docs/RESULTS.md is generated from the results files, never written by hand. This
      # fails if the two have drifted apart — which is how the headline number moved three
      # times without the system changing.
      - name: Results document is current
        run: python scripts/render_results.py --check

      # The benchmark page is hand-designed so it cannot be regenerated, but it quotes the
      # same figures. This reads them back out and compares them to data/results/.
      - name: Benchmark page agrees with the results
        run: python scripts/check_benchmark.py
