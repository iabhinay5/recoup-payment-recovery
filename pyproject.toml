[project]
name = "recoup"
version = "0.1.0"
description = "Agentic failed-payment recovery for Indian payment rails"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sim = ["numpy>=1.26", "pandas>=2.1", "openpyxl>=3.1"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.4"]
llm = ["httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pandas-stubs>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
